apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-user
  template:
    metadata:
      labels:
        app: api-user
    spec:
      containers:
        - name: api-user
          image: api-user:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000